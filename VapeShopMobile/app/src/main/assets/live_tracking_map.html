<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
        .rider-motor-icon { background: transparent; border: none; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    let map = L.map('map').setView([6.1164, 125.1716], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const riderIcon = L.divIcon({
        className: 'rider-motor-icon',
        html: '<div style="font-size:24px;line-height:24px;">🏍️</div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    let storeMarker = null;
    let destMarker = null;
    let riderMarker = null;
    let routeLine = null;
    let routeFetchTimer = null;
    let lastRouteKey = '';
    let lastPayload = null;
    let animFrame = null;
    let lastRiderLat = null;
    let lastRiderLng = null;
    let riderUsesDeviceGps = false;

    window.setRiderUsesDeviceGps = function (useDevice) {
        riderUsesDeviceGps = !!useDevice;
    };

    function hasCoord(lat, lng) {
        return lat !== null && lat !== undefined && lng !== null && lng !== undefined
            && !isNaN(Number(lat)) && !isNaN(Number(lng))
            && !(Number(lat) === 0 && Number(lng) === 0);
    }

    function haversineM(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2
            + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function animateRider(toLat, toLng, durationMs) {
        const targetLat = Number(toLat);
        const targetLng = Number(toLng);
        if (!hasCoord(targetLat, targetLng)) return;

        if (lastRiderLat !== null && lastRiderLng !== null) {
            const jumpM = haversineM(lastRiderLat, lastRiderLng, targetLat, targetLng);
            if (jumpM < 8) {
                durationMs = 0;
            } else if (jumpM < 40) {
                durationMs = Math.min(durationMs, 350);
            }
        }

        if (!riderMarker) {
            riderMarker = L.marker([targetLat, targetLng], { icon: riderIcon }).addTo(map).bindPopup('Rider');
            lastRiderLat = targetLat;
            lastRiderLng = targetLng;
            return;
        }

        if (durationMs <= 0) {
            if (animFrame) cancelAnimationFrame(animFrame);
            riderMarker.setLatLng([targetLat, targetLng]);
            lastRiderLat = targetLat;
            lastRiderLng = targetLng;
            return;
        }

        const from = riderMarker.getLatLng();
        const startLat = from.lat;
        const startLng = from.lng;
        const startTs = performance.now();
        if (animFrame) cancelAnimationFrame(animFrame);
        const step = (now) => {
            const t = Math.min(1, (now - startTs) / durationMs);
            const lat = startLat + (targetLat - startLat) * t;
            const lng = startLng + (targetLng - startLng) * t;
            riderMarker.setLatLng([lat, lng]);
            if (t < 1) {
                animFrame = requestAnimationFrame(step);
            } else {
                lastRiderLat = targetLat;
                lastRiderLng = targetLng;
            }
        };
        animFrame = requestAnimationFrame(step);
    }

    function routeDestination(payload) {
        const phase = String(payload?.phase || 'delivery');
        if (phase === 'pickup' && hasCoord(payload.store_latitude, payload.store_longitude)) {
            return { lat: Number(payload.store_latitude), lng: Number(payload.store_longitude) };
        }
        if (hasCoord(payload.delivery_latitude, payload.delivery_longitude)) {
            return { lat: Number(payload.delivery_latitude), lng: Number(payload.delivery_longitude) };
        }
        if (hasCoord(payload.store_latitude, payload.store_longitude)) {
            return { lat: Number(payload.store_latitude), lng: Number(payload.store_longitude) };
        }
        return null;
    }

    function drawRouteGuide(fromLat, fromLng, toLat, toLng) {
        const key = fromLat.toFixed(4) + ',' + fromLng.toFixed(4) + '>' + toLat.toFixed(4) + ',' + toLng.toFixed(4);
        if (key === lastRouteKey && routeLine) return;
        lastRouteKey = key;

        if (routeFetchTimer) clearTimeout(routeFetchTimer);
        routeFetchTimer = setTimeout(async () => {
            try {
                const url = 'https://router.project-osrm.org/route/v1/driving/'
                    + fromLng + ',' + fromLat + ';' + toLng + ',' + toLat
                    + '?overview=full&geometries=geojson';
                const res = await fetch(url);
                const data = await res.json();
                if (!data?.routes?.length) throw new Error('no route');
                const coords = (data.routes[0].geometry?.coordinates || []).map(c => [c[1], c[0]]);
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline(coords, { color: '#1976d2', weight: 5, opacity: 0.92 }).addTo(map);
            } catch (e) {
                if (routeLine) map.removeLayer(routeLine);
                routeLine = L.polyline([[fromLat, fromLng], [toLat, toLng]], {
                    color: '#27c56f', dashArray: '8 8', weight: 4, opacity: 0.85
                }).addTo(map);
            }
        }, 180);
    }

    function maybeUpdateRoute(payload, riderLat, riderLng) {
        const dest = routeDestination(payload);
        if (!dest || !hasCoord(riderLat, riderLng)) return;
        drawRouteGuide(Number(riderLat), Number(riderLng), dest.lat, dest.lng);
    }

    function fitMapPoints(payload, riderLat, riderLng) {
        const points = [];
        if (hasCoord(payload.store_latitude, payload.store_longitude)) {
            points.push([Number(payload.store_latitude), Number(payload.store_longitude)]);
        }
        if (hasCoord(payload.delivery_latitude, payload.delivery_longitude)) {
            points.push([Number(payload.delivery_latitude), Number(payload.delivery_longitude)]);
        }
        if (hasCoord(riderLat, riderLng)) {
            points.push([Number(riderLat), Number(riderLng)]);
        }
        if (points.length >= 2) {
            map.fitBounds(L.latLngBounds(points).pad(0.2));
        } else if (points.length === 1) {
            map.setView(points[0], 15);
        }
    }

    window.updateRiderOnly = function (lat, lng) {
        if (!hasCoord(lat, lng)) return;
        animateRider(Number(lat), Number(lng), 400);
        if (lastPayload) {
            maybeUpdateRoute(lastPayload, lat, lng);
        }
    };

    window.updateTracking = function (payload) {
        if (!payload) return;
        lastPayload = payload;
        setTimeout(function () { map.invalidateSize(); }, 120);

        const destIcon = L.divIcon({
            className: 'dest-pin-icon',
            html: '<div style="font-size:26px;line-height:26px;">📍</div>',
            iconSize: [26, 26],
            iconAnchor: [13, 26]
        });
        const storeIcon = L.divIcon({
            className: 'store-pin-icon',
            html: '<div style="font-size:22px;line-height:22px;">🏪</div>',
            iconSize: [22, 22],
            iconAnchor: [11, 22]
        });

        if (hasCoord(payload.store_latitude, payload.store_longitude)) {
            const s = [Number(payload.store_latitude), Number(payload.store_longitude)];
            if (!storeMarker) {
                storeMarker = L.marker(s, { icon: storeIcon }).addTo(map).bindPopup(payload.store_address || 'Store');
            } else {
                storeMarker.setLatLng(s);
            }
        }

        if (hasCoord(payload.delivery_latitude, payload.delivery_longitude)) {
            const d = [Number(payload.delivery_latitude), Number(payload.delivery_longitude)];
            if (!destMarker) {
                destMarker = L.marker(d, { icon: destIcon }).addTo(map).bindPopup(payload.delivery_address || 'Customer');
            } else {
                destMarker.setLatLng(d);
            }
        }

        let riderLat = payload.rider_latitude;
        let riderLng = payload.rider_longitude;

        if (riderUsesDeviceGps) {
            if (lastRiderLat !== null && lastRiderLng !== null) {
                riderLat = lastRiderLat;
                riderLng = lastRiderLng;
            } else if (hasCoord(riderLat, riderLng)) {
                animateRider(Number(riderLat), Number(riderLng), 0);
            }
        } else if (hasCoord(riderLat, riderLng)) {
            animateRider(Number(riderLat), Number(riderLng), 500);
        }

        fitMapPoints(payload, riderLat, riderLng);
        maybeUpdateRoute(payload, riderLat, riderLng);
    };
</script>
</body>
</html>
