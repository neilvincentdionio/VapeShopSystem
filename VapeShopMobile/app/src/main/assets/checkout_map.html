<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const defaultLat = 6.1164;
    const defaultLng = 125.1716;
    let map = L.map('map', { zoomControl: true }).setView([defaultLat, defaultLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    function notify(lat, lng) {
        if (window.AndroidCheckoutMap && window.AndroidCheckoutMap.onLocationPicked) {
            window.AndroidCheckoutMap.onLocationPicked(lat, lng);
        }
    }

    window.setLocation = function (lat, lng, zoom) {
        const ll = [lat, lng];
        marker.setLatLng(ll);
        map.setView(ll, zoom || Math.max(map.getZoom(), 17));
        notify(lat, lng);
        setTimeout(function () { map.invalidateSize(); }, 200);
    };

    marker.on('dragend', function () {
        const pos = marker.getLatLng();
        notify(pos.lat, pos.lng);
    });

    map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        notify(e.latlng.lat, e.latlng.lng);
    });

    setTimeout(function () { map.invalidateSize(); }, 400);
</script>
</body>
</html>
